[project]
name = "netra"
version = "0.1.0"
description = "Offline voice + vision assistant for blind and low-vision PC users, accelerated on the Snapdragon NPU."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pillow>=10.0",
    "mss>=9.0",
    "sounddevice>=0.4.7",
    "pynput>=1.7.7",
    # --- Snapdragon (Windows on ARM64): Whisper on the Hexagon NPU via ONNX Runtime QNN EP ---
    "onnxruntime-qnn>=2.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "transformers>=4.50; sys_platform == 'win32' and platform_machine == 'ARM64'",
    # --- Windows native OCR + neural TTS (OneCore voices incl. Hindi) ---
    "winrt-runtime>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Media.SpeechSynthesis>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.3; sys_platform == 'win32'",
    # --- Dev machines (macOS / x64): CPU/Metal fallbacks so the app runs anywhere ---
    "faster-whisper>=1.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "ocrmac>=1.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
camera = ["opencv-python-headless>=4.10"]

[project.scripts]
netra = "netra.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netra"]

[dependency-groups]
dev = ["pytest>=8"]
